name: Publish to NuGet

on:
  workflow_dispatch:
    inputs:
      publish_main:
        description: 'Publish Masterly.NonEmptyList'
        required: true
        type: boolean
        default: true
      publish_efcore:
        description: 'Publish Masterly.NonEmptyList.EntityFrameworkCore'
        required: true
        type: boolean
        default: true
  workflow_run:
    workflows: [Build]
    branches: [master]
    types: [completed]

jobs:
  publish-main:
    name: Publish Main Package
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && inputs.publish_main) }}
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      published: ${{ steps.publish_nuget.outputs.VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Extract version from csproj
        id: get_version
        run: |
          VERSION=$(grep -oP '<Version>\K[^<]+' src/Masterly.NonEmptyList/Masterly.NonEmptyList.csproj)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish Masterly.NonEmptyList to NuGet
        id: publish_nuget
        uses: alirezanet/publish-nuget@v3.1.0
        with:
          PROJECT_FILE_PATH: src/Masterly.NonEmptyList/Masterly.NonEmptyList.csproj
          VERSION_REGEX: ^\s*<Version>(.*)<\/Version>\s*$
          TAG_COMMIT: true
          TAG_FORMAT: v*
          NUGET_KEY: ${{ secrets.NUGET_API_KEY }}
          INCLUDE_SYMBOLS: false

  publish-efcore:
    name: Publish EF Core Package
    runs-on: ubuntu-latest
    needs: publish-main
    if: ${{ always() && (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && inputs.publish_efcore) }}
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      published: ${{ steps.publish_efcore.outputs.VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Extract version from csproj
        id: get_version
        run: |
          VERSION=$(grep -oP '<Version>\K[^<]+' src/Masterly.NonEmptyList.EntityFrameworkCore/Masterly.NonEmptyList.EntityFrameworkCore.csproj)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Wait for NuGet package availability
        if: ${{ needs.publish-main.outputs.published != '' }}
        run: |
          echo "Waiting for Masterly.NonEmptyList ${{ needs.publish-main.outputs.version }} to be available on NuGet..."
          MAX_ATTEMPTS=30
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS..."

            # Check if package is available
            if dotnet nuget search Masterly.NonEmptyList --source https://api.nuget.org/v3/index.json | grep -q "Masterly.NonEmptyList"; then
              # Verify exact version is available
              dotnet add src/Masterly.NonEmptyList.EntityFrameworkCore/Masterly.NonEmptyList.EntityFrameworkCore.csproj package Masterly.NonEmptyList --version ${{ needs.publish-main.outputs.version }} --no-restore 2>/dev/null && {
                echo "Package Masterly.NonEmptyList ${{ needs.publish-main.outputs.version }} is now available!"
                break
              }
            fi

            if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
              echo "Package not available after $MAX_ATTEMPTS attempts, proceeding anyway..."
              break
            fi

            echo "Package not yet available, waiting 60 seconds..."
            sleep 60
          done

      - name: Publish Masterly.NonEmptyList.EntityFrameworkCore to NuGet
        id: publish_efcore
        uses: alirezanet/publish-nuget@v3.1.0
        with:
          PROJECT_FILE_PATH: src/Masterly.NonEmptyList.EntityFrameworkCore/Masterly.NonEmptyList.EntityFrameworkCore.csproj
          VERSION_REGEX: ^\s*<Version>(.*)<\/Version>\s*$
          TAG_COMMIT: false
          NUGET_KEY: ${{ secrets.NUGET_API_KEY }}
          INCLUDE_SYMBOLS: false

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-main, publish-efcore]
    if: ${{ always() && (needs.publish-main.result == 'success' || needs.publish-efcore.result == 'success') }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          # Use main package version if available, otherwise use EF Core version
          if [ -n "${{ needs.publish-main.outputs.version }}" ]; then
            echo "version=${{ needs.publish-main.outputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep -oP '<Version>\K[^<]+' src/Masterly.NonEmptyList.EntityFrameworkCore/Masterly.NonEmptyList.EntityFrameworkCore.csproj)
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  on-failure:
    name: Build Failed
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Report failure
        run: |
          echo "::error::Build workflow failed. NuGet publish skipped."
          exit 1
