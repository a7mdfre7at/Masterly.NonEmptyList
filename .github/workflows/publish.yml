name: Publish to NuGet

on:
  workflow_dispatch:
    inputs:
      publish_main:
        description: 'Publish Masterly.NonEmptyList'
        required: true
        type: boolean
        default: true
      publish_satellites:
        description: 'Publish the integration packages (EF Core, AspNetCore, Configuration, NewtonsoftJson, MessagePack, Dapper, Testing)'
        required: true
        type: boolean
        default: true
  workflow_run:
    workflows: [Build]
    branches: [master]
    types: [completed]

jobs:
  publish-main:
    name: Publish Main Package
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && inputs.publish_main) }}
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      published: ${{ steps.publish_nuget.outputs.VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Extract version from csproj
        id: get_version
        run: |
          VERSION=$(grep -oP '<Version>\K[^<]+' src/Masterly.NonEmptyList/Masterly.NonEmptyList.csproj)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # The analyzer and code-fix assemblies are packed into analyzers/dotnet/cs of the main package,
      # so they must be built (Release) before packing.
      - name: Build analyzers
        run: |
          dotnet build src/Masterly.NonEmptyList.Analyzers/Masterly.NonEmptyList.Analyzers.csproj --configuration Release
          dotnet build src/Masterly.NonEmptyList.Analyzers.CodeFixes/Masterly.NonEmptyList.Analyzers.CodeFixes.csproj --configuration Release

      - name: Publish Masterly.NonEmptyList to NuGet
        id: publish_nuget
        uses: alirezanet/publish-nuget@v3.1.0
        with:
          PROJECT_FILE_PATH: src/Masterly.NonEmptyList/Masterly.NonEmptyList.csproj
          VERSION_REGEX: ^\s*<Version>(.*)<\/Version>\s*$
          TAG_COMMIT: true
          TAG_FORMAT: v*
          NUGET_KEY: ${{ secrets.NUGET_API_KEY }}
          INCLUDE_SYMBOLS: false

  publish-satellites:
    name: Publish ${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: publish-main
    if: ${{ always() && ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && inputs.publish_satellites)) }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - Masterly.NonEmptyList.EntityFrameworkCore
          - Masterly.NonEmptyList.AspNetCore
          - Masterly.NonEmptyList.Configuration
          - Masterly.NonEmptyList.NewtonsoftJson
          - Masterly.NonEmptyList.MessagePack
          - Masterly.NonEmptyList.Dapper
          - Masterly.NonEmptyList.Testing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Wait for Masterly.NonEmptyList on NuGet
        if: ${{ needs.publish-main.outputs.published != '' }}
        run: |
          VERSION="${{ needs.publish-main.outputs.version }}"
          echo "Waiting for Masterly.NonEmptyList $VERSION to be available on NuGet..."
          for ATTEMPT in $(seq 1 30); do
            if curl -sfI "https://api.nuget.org/v3-flatcontainer/masterly.nonemptylist/$VERSION/masterly.nonemptylist.$VERSION.nupkg" > /dev/null; then
              echo "Available after $ATTEMPT attempt(s)."
              exit 0
            fi
            echo "Attempt $ATTEMPT of 30: not yet available, waiting 60 seconds..."
            sleep 60
          done
          echo "Package not available after 30 attempts, proceeding anyway..."

      - name: Restore and pack
        run: |
          dotnet restore src/${{ matrix.package }}/${{ matrix.package }}.csproj -p:IsPackaging=true
          dotnet pack src/${{ matrix.package }}/${{ matrix.package }}.csproj --configuration Release --no-restore -p:IsPackaging=true -o ./nupkg

      - name: Push to NuGet
        run: |
          PACKAGE=$(ls ./nupkg/*.nupkg | head -1)
          echo "Pushing $PACKAGE to NuGet..."
          dotnet nuget push "$PACKAGE" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-main, publish-satellites]
    if: ${{ always() && (needs.publish-main.result == 'success' || needs.publish-satellites.result == 'success') }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          VERSION=$(grep -oP '<Version>\K[^<]+' src/Masterly.NonEmptyList/Masterly.NonEmptyList.csproj)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  on-failure:
    name: Build Failed
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Report failure
        run: |
          echo "::error::Build workflow failed. NuGet publish skipped."
          exit 1
